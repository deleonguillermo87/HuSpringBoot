<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos Listados</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }

        h1 {
            color: #1e3a8a;
            margin: 0;
            font-size: 2rem;
        }

        .btn-create {
            background-color: #1e3a8a;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.2s;
            box-shadow: 0 2px 5px rgba(30, 58, 138, 0.2);
        }

        .btn-create:hover {
            background-color: #152963;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background-color: #fff;
        }

        th {
            background-color: #1e3a8a;
            color: #ffffff;
            padding: 14px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #4a5568;
            font-size: 0.95rem;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .event-link {
            color: #1e3a8a;
            text-decoration: none;
            font-weight: 600;
        }

        .event-link:hover {
            text-decoration: underline;
        }

        .no-data {
            background-color: #f8fafc;
            padding: 30px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>🎉 Eventos Listados</h1>
        <a th:href="@{/admin/event/nuevo}" class="btn-create">➕ Crear Evento</a>
    </div>

    <div th:if="${message}" class="alert alert-success">
        <p th:text="${message}"></p>
    </div>

    <div th:if="${error}" class="alert alert-error">
        <p th:text="${error}"></p>
    </div>

    <table th:unless="${#lists.isEmpty(events)}">
        <thead>
        <tr>
            <th style="border-top-left-radius: 8px; width: 80px;">ID</th>
            <th>Nombre del Evento</th>
            <th>Fecha y Hora</th>
            <th style="border-top-right-radius: 8px;">Descripción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="evento : ${events}">
            <td th:text="${evento.id}" style="font-weight: bold; color: #1e3a8a;">1</td>
            <!-- El nombre es un enlace para ver detalles y editar -->
            <td style="text-align: left;">
                <a th:href="@{/admin/event/{id}(id=${evento.id})}" th:text="${evento.nombre}" class="event-link">Nombre</a>
            </td>
            <td th:text="${#temporals.format(evento.fecha, 'dd/MM/yyyy HH:mm')}">24/09/2026 19:30</td>
            <td th:text="${evento.descripcion}" style="text-align: left;">Descripción</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(events)}" class="no-data">
        <p>No hay eventos registrados en este momento en la base de datos.</p>
    </div>
</div>

</body>
</html>
